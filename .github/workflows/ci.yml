name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------
  # Backend: FastAPI + PostgreSQL
  # ---------------------------------------------------------------
  backend:
    name: Backend (FastAPI)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: smartcity_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Adjust the variable names to match backend/app/core/config.py
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/smartcity_test
      SECRET_KEY: ci-test-secret-key
      ENVIRONMENT: test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest ruff

      - name: Lint (non-blocking for now)
        run: ruff check app
        continue-on-error: true

      - name: Check the app imports
        run: python -c "from app.main import app; print('FastAPI app loaded')"

      - name: Run database migrations
        if: ${{ hashFiles('backend/alembic.ini') != '' }}
        run: alembic upgrade head

      - name: Run tests
        # Exit code 5 means "no tests collected", which is fine early in the project
        run: pytest || [ $? -eq 5 ]

  # ---------------------------------------------------------------
  # Docker: build the backend image and validate compose file
  # ---------------------------------------------------------------
  docker:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate docker-compose file
        if: ${{ hashFiles('docker-compose.yml', 'docker-compose.yaml', 'backend/docker-compose.yml') != '' }}
        run: |
          for f in docker-compose.yml docker-compose.yaml backend/docker-compose.yml; do
            if [ -f "$f" ]; then
              cp .env.example .env 2>/dev/null || cp backend/.env.example .env 2>/dev/null || true
              docker compose -f "$f" config > /dev/null
              echo "Validated $f"
            fi
          done

      - name: Set up Docker Buildx
        if: ${{ hashFiles('backend/Dockerfile') != '' }}
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        if: ${{ hashFiles('backend/Dockerfile') != '' }}
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/Dockerfile
          push: false
          tags: smartcity-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---------------------------------------------------------------
  # Frontend: Flutter (skips automatically until the project exists)
  # ---------------------------------------------------------------
  frontend:
    name: Frontend (Flutter)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/smart_city_app
    steps:
      - uses: actions/checkout@v4

      - name: Check Flutter project exists
        id: check
        working-directory: .
        run: |
          if [ -f frontend/smart_city_app/pubspec.yaml ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "No pubspec.yaml yet - skipping Flutter checks."
          fi

      - uses: subosito/flutter-action@v2
        if: steps.check.outputs.exists == 'true'
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        if: steps.check.outputs.exists == 'true'
        run: flutter pub get

      - name: Check formatting (non-blocking for now)
        if: steps.check.outputs.exists == 'true'
        run: dart format --output=none --set-exit-if-changed .
        continue-on-error: true

      - name: Analyze
        if: steps.check.outputs.exists == 'true'
        run: flutter analyze

      - name: Run tests
        if: steps.check.outputs.exists == 'true' && hashFiles('frontend/smart_city_app/test/**') != ''
        run: flutter test
